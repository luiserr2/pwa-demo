version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sisbirceca_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sisbirceca_db
    ports:
      - "5432:5432"
    volumes:
      - sisbirceca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisbirceca_app
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sisbirceca_db
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sisbirceca_pgdata:
